version: '3.9'

services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    entrypoint: sh
    command:
      -c "mkdir -p /data/pwa-dev && /usr/bin/minio server /data --console-address ':9001'"

  clamav:
    image: clamav/clamav-debian:1.5.2
    ports:
      - "3310:3310"